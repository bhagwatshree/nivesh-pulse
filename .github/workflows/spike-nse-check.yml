name: Spike - NSE reachability check

# Throwaway diagnostic workflow: confirms whether GitHub Actions runner
# IPs can reach nseindia.com before building the real announcements-fetch
# pipeline. Delete this file (and scripts/spike-nse-check.mjs) once
# answered either way.
on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/spike-nse-check.mjs
